name: Preview packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows/amd64
          - os: ubuntu-latest
            target: linux/amd64
          - os: macos-latest
            target: darwin/arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/check_public.py --tracked
      - run: python scripts/check_repository.py --tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - run: python scripts/test.py ${{ runner.os == 'Linux' && '--race' || '' }}
      - run: go vet ./...
      - if: runner.os == 'Windows'
        run: python scripts/build.py --platform ${{ matrix.target }} --installer
      - if: runner.os != 'Windows'
        run: python scripts/build.py --platform ${{ matrix.target }}
      - run: python scripts/package.py --platform ${{ matrix.target }}
      - run: python scripts/check_artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rclonego-${{ runner.os }}
          path: dist/
          retention-days: 14
  draft:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rclonego-*
          path: release-artifacts
      - name: Assemble checked packages and bilingual notes
        run: python3 scripts/assemble_release.py release-artifacts release
      - name: Prepare a reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "RcloneGo ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Published releases are immutable; create a new version." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
