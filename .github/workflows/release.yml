name: Preview packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows/amd64
          - os: ubuntu-latest
            target: linux/amd64
          - os: macos-latest
            target: darwin/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/check_public.py --tracked
      - run: python scripts/test.py
      - run: go vet ./...
      - if: runner.os == 'Windows'
        run: python scripts/build.py --platform ${{ matrix.target }} --installer
      - if: runner.os != 'Windows'
        run: python scripts/build.py --platform ${{ matrix.target }}
      - run: python scripts/package.py --platform ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rclonego-${{ runner.os }}
          path: dist/
