name: Release packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string
      require_os_signing:
        description: Require trusted Windows signing and notarized macOS packages
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: packages-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Resolve tag and reject published releases
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/prepare_release.py resolve
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
      - run: python3 scripts/check_public.py --tracked
      - name: Verify version and documentation links
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: python3 scripts/check_repository.py --tag "$RELEASE_TAG"
  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows/amd64
            artifact: windows-amd64
          - os: windows-11-arm
            target: windows/arm64
            artifact: windows-arm64
          - os: ubuntu-latest
            target: linux/amd64
            artifact: linux-amd64
          - os: macos-15-intel
            target: darwin/amd64
            artifact: darwin-amd64
          - os: macos-15
            target: darwin/arm64
            artifact: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python scripts/test.py ${{ runner.os == 'Linux' && '--race' || '' }}
      - run: go vet ./...
      - name: Prepare optional Windows signing
        if: inputs.require_os_signing && runner.os == 'Windows'
        env:
          RCLONEGO_WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          RCLONEGO_WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: python scripts/release_signing.py prepare
      - name: Prepare optional macOS signing
        if: inputs.require_os_signing && runner.os == 'macOS'
        env:
          RCLONEGO_MACOS_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          RCLONEGO_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          RCLONEGO_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          RCLONEGO_APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          RCLONEGO_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          RCLONEGO_APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python scripts/release_signing.py prepare
      - if: runner.os == 'Windows'
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.require_os_signing && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          RCLONEGO_WINDOWS_SIGN_COMMAND: ${{ inputs.require_os_signing && secrets.WINDOWS_SIGN_COMMAND || '' }}
        run: python scripts/build.py --platform ${{ matrix.target }} --installer --require-signed-updates ${{ inputs.require_os_signing && '--require-os-signing' || '' }}
      - if: runner.os == 'macOS'
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          RCLONEGO_MACOS_SIGNING_IDENTITY: ${{ inputs.require_os_signing && secrets.MACOS_SIGNING_IDENTITY || '' }}
        run: python scripts/build.py --platform ${{ matrix.target }} --require-signed-updates ${{ inputs.require_os_signing && '--require-os-signing' || '' }}
      - if: runner.os == 'Linux'
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: python scripts/build.py --platform ${{ matrix.target }} --require-signed-updates
      - run: python scripts/check_native_package.py --platform ${{ matrix.target }}
      - run: python scripts/package.py --platform ${{ matrix.target }}
      - run: python scripts/check_artifacts.py --require-signed-updates --platform ${{ matrix.target }} ${{ runner.os == 'Windows' && '--require-installer' || '' }}
      - name: Remove temporary OS-signing credentials
        if: always() && inputs.require_os_signing && runner.os != 'Linux'
        run: python scripts/release_signing.py cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rclonego-${{ matrix.artifact }}
          path: dist/
          retention-days: 14
  draft:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: rclonego-*
          path: release-artifacts
      - name: Assemble checked packages and bilingual notes
        run: python3 scripts/assemble_release.py release-artifacts release
      - name: Prepare a reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 scripts/prepare_release.py draft
