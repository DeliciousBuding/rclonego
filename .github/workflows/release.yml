name: Preview packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows/amd64
          - os: ubuntu-latest
            target: linux/amd64
          - os: macos-latest
            target: darwin/arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python scripts/check_public.py --tracked
      - run: python scripts/check_repository.py --tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - run: python scripts/test.py ${{ runner.os == 'Linux' && '--race' || '' }}
      - run: go vet ./...
      - if: runner.os == 'Windows'
        run: python scripts/build.py --platform ${{ matrix.target }} --installer
      - if: runner.os != 'Windows'
        run: python scripts/build.py --platform ${{ matrix.target }}
      - run: python scripts/package.py --platform ${{ matrix.target }}
      - run: python scripts/check_artifacts.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rclonego-${{ runner.os }}
          path: dist/
          retention-days: 14
  draft:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: rclonego-*
          path: release-artifacts
      - name: Assemble checked packages and bilingual notes
        run: python3 scripts/assemble_release.py release-artifacts release
      - name: Prepare a reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "RcloneGo ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
