name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_public.py --tracked
      - run: python scripts/check_repository.py
      - run: python scripts/test.py ${{ runner.os == 'Linux' && '--race' || '' }}
      - run: go vet ./...
      - run: go build -trimpath ./cmd/rclonego
      - run: python scripts/update_contract.py
      - run: git diff --exit-code -- internal/api/openapi.json
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
